# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  FLUTTER: flutter
  ADB: adb
  BUILD_TARGET_PLATFORM: android-arm64
  DEBUG_APK: build/app/outputs/flutter-apk/app-debug.apk
  ANDROID_PACKAGE: com.viocha.alist_android
  ANDROID_ACTIVITY: .MainActivity
  ICON_SCRIPT: scripts/generate_app_icon.mjs
  ICON_SOURCE_SVG: assets/app_icon/icon.svg
  ICON_OUTPUT_PNG: build/app_icon/icon.png
  ANDROID_RES_DIR: android/app/src/main/res

tasks:
  prepare:android:runtime:
    desc: 下载并校验内置 AList 运行时，已校验的缓存可直接使用
    cmds:
      - 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare_alist_runtime.ps1'

  prepare:android:icon:
    desc: 根据 SVG 源文件生成应用启动图标
    cmds:
      - 'node "{{.ICON_SCRIPT}}" --source "{{.ICON_SOURCE_SVG}}" --output "{{.ICON_OUTPUT_PNG}}" --android-res "{{.ANDROID_RES_DIR}}"'

  build:android:
    desc: 构建 ARM64 Android 调试版 APK
    cmds:
      - task: prepare:android:runtime
      - task: prepare:android:icon
      - '{{.FLUTTER}} build apk --debug --target-platform {{.BUILD_TARGET_PLATFORM}}'

  install:android:only:
    desc: 将已构建的 ARM64 Android 调试版 APK 安装到已连接的设备
    cmds:
      - 'powershell -NoProfile -Command "if (-not (Test-Path ''{{.DEBUG_APK}}'')) { throw ''APK 不存在，请先执行 task build:android'' }; & {{.ADB}} install -r ''{{.DEBUG_APK}}''"'

  install:android:
    desc: 构建 ARM64 Android 调试版 APK 并安装到已连接的设备
    deps:
      - build:android
    cmds:
      - task: install:android:only

  launch:android:
    desc: 在已连接的 Android 设备上启动应用
    cmds:
      - '{{.ADB}} shell am start -n {{.ANDROID_PACKAGE}}/{{.ANDROID_ACTIVITY}}'

  debug:android:
    desc: 在首台已连接的 Android 设备上运行应用并启用 Flutter 调试和热重载
    cmds:
      - task: prepare:android:runtime
      - >
        powershell -NoProfile -Command '$deviceLine = (& {{.ADB}} devices) |
        Where-Object { $_ -match "^[^\s]+\s+device$" } | Select-Object -First 1;
        if (-not $deviceLine) { throw "没有检测到已连接的 Android 设备" };
        $serial = ($deviceLine -split "\s+")[0];
        & {{.FLUTTER}} run -d $serial'

  run:android:
    desc: 构建 ARM64 Android 应用并在已连接的设备上安装和启动
    deps:
      - install:android
    cmds:
      - task: launch:android
